on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

name: Release

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Note: no Composer install here on purpose. release-please only reads the
      # git history and release-please-config.json, so it needs no PHP dependencies.
      # Installing them also broke this job: the runner's system PHP is 8.3, while
      # our dev requirement phpunit/phpunit ^13 needs PHP >= 8.4.1.
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json

  # Note: the shared linchpin/actions update-readme job used to run here. It builds a
  # plugin/theme table from composer.lock, and this repo is a phpcs standards library:
  # composer.lock is gitignored and the README has no such table, so the job never had
  # anything to do. As of @v4 it also hard-fails, because `git add README.md composer.lock`
  # is unguarded and the lock file does not exist here.
